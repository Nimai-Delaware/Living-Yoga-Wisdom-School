<style>

*, *::before, *::after { box-sizing: border-box; }

:root {
  --indigo-deep: #1a2060;
  --gold: #c9922a;
  --gold-light: #e8b84b;
  --cream: #f7f4ef;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: var(--cream);
  color: var(--indigo-deep);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a:focus-visible, button:focus-visible {
  outline: 3px solid var(--gold-light); outline-offset: 3px; border-radius: 3px;
}

/* ===================== NAV ===================== */
#main-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 48px;
  background: rgba(26,32,96,0.96);
  backdrop-filter: blur(12px);
  box-shadow: 0 2px 24px rgba(0,0,0,0.2);
}
.nav-logo { width: 48px; height: 48px; border-radius: 50%; background: white; padding: 4px; display: block; }
.nav-links { list-style: none; margin: 0; padding: 0; display: flex; gap: 36px; }
.nav-links a {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.82);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--gold-light); }

/* ===================== MAIN ===================== */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 140px 24px 80px;
}

.coming-soon-wrap { max-width: 560px; }

.coming-soon-wrap h1 {
  font-family: 'Cinzel', serif;
  font-weight: 400;
  font-size: clamp(1.6em, 3vw, 2.2em);
  color: var(--indigo-deep);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.coming-soon-sub {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(2.2em, 5vw, 3.4em);
  font-style: italic;
  color: var(--indigo-deep);
  line-height: 1.15;
  margin-bottom: 24px;
}

.coming-soon-divider {
  width: 60px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
  margin: 0 auto 28px;
}

.coming-soon-wrap p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2em;
  font-style: italic;
  font-weight: 300;
  color: rgba(26,32,96,0.65);
  line-height: 1.7;
  margin-bottom: 40px;
}

.btn-back {
  display: inline-block;
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--indigo-deep);
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  padding: 14px 36px;
  border-radius: 3px;
  text-decoration: none;
  box-shadow: 0 8px 24px rgba(201,146,42,0.3);
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-back:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(201,146,42,0.45); }

/* ===================== FOOTER ===================== */
footer {
  background: #0d1130;
  padding: 40px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  border-top: 1px solid rgba(201,146,42,0.1);
}

footer p {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.4);
  text-align: center;
  margin-top: 12px;
}

.footer-links {
  display: flex;
  gap: 28px;
  list-style: none;
  padding: 0;
  margin: 0;
}

.footer-links a {
  font-family: 'Cinzel', serif;
  font-size: 14px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  transition: color 0.2s;
}

.footer-links a:hover { color: var(--gold-light); }

.social-icons {
  display: flex;
  justify-content: center;
  gap: 28px;
}

.social-icons button {
  background: none; border: none; cursor: pointer;
  padding: 6px; color: rgba(255,255,255,1);
  transition: color 0.2s, transform 0.2s; line-height: 0;
}

.social-icons button:hover { color: var(--gold-light); transform: translateY(-2px); }

.social-toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(26,32,96,0.96); color: rgba(255,255,255,0.9);
  font-family: Georgia, serif; font-size: 14px; padding: 12px 28px;
  border-radius: 50px; border: 1px solid rgba(201,146,42,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3); opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s; z-index: 500; white-space: nowrap;
}
.social-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===================== HAMBURGER ===================== */
.hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 4px;
}
.hamburger span {
  display: block; width: 24px; height: 2px;
  background: rgba(255,255,255,0.85); border-radius: 2px;
  transition: transform 0.25s, opacity 0.25s;
}
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.mobile-menu {
  display: none; position: fixed;
  top: 0; left: 0; right: 0;
  background: rgba(26,32,96,0.98);
  backdrop-filter: blur(12px);
  z-index: 105; padding: 80px 32px 40px;
  flex-direction: column; gap: 8px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.15em;
  text-transform: uppercase; color: rgba(255,255,255,0.85); text-decoration: none;
  padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08); transition: color 0.2s;
}
.mobile-menu a:last-child { border-bottom: none; }
.mobile-menu a:hover { color: var(--gold-light); }
.mobile-menu-close {
  position: absolute; top: 20px; right: 24px;
  background: none; border: none; color: rgba(255,255,255,0.7);
  font-size: 28px; line-height: 1; cursor: pointer; padding: 4px 8px;
}
.mobile-menu-close:hover { color: white; }

@media (max-width: 600px) {
  #main-nav { padding: 14px 20px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .nav-logo { width: 40px; height: 40px; }
  main { padding: 100px 20px 60px; }
  footer { padding: 28px 20px; }
  .footer-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
}

<script>
const nav = document.getElementById('main-nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 60);
});

let toastTimer;
function showComingSoon() {
  const toast = document.getElementById('social-toast');
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobile-menu');
const mobileClose = document.getElementById('mobile-menu-close');

function closeMobileMenu() {
  mobileMenu.classList.remove('open');
  hamburger.classList.remove('open');
  hamburger.setAttribute('aria-expanded', 'false');
  hamburger.setAttribute('aria-label', 'Open menu');
  document.body.style.overflow = '';
}

hamburger.addEventListener('click', () => {
  const isOpen = mobileMenu.classList.toggle('open');
  hamburger.classList.toggle('open', isOpen);
  hamburger.setAttribute('aria-expanded', isOpen);
  hamburger.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
  document.body.style.overflow = isOpen ? 'hidden' : '';
});

mobileClose.addEventListener('click', closeMobileMenu);

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeMobileMenu();
});

mobileMenu.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', closeMobileMenu);
});
</script>
