<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/images/favicon.jpg">
<title>Support | Living Yoga Wisdom School</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CP6NQR8V2M"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CP6NQR8V2M');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; }

:root {
  --indigo-deep: #1a2060;
  --gold: #c9922a;
  --gold-light: #e8b84b;
  --cream: #f5f0e8;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0d1130;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===================== TOPO BACKGROUND ===================== */
.topo-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: url("https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/images/topomap.jpg");
  background-size: cover;
  background-position: center;
  opacity: 0.08;
}

.topo-overlay {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(26,32,96,0.55) 0%, rgba(10,15,50,0.82) 100%);
}

/* ===================== NAV ===================== */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 48px;
  transition: background 0.3s, box-shadow 0.3s;
}
nav.scrolled {
  background: rgba(13,17,48,0.96);
  backdrop-filter: blur(12px);
  box-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.nav-logo { width: 48px; height: 48px; border-radius: 50%; }
.nav-links { list-style: none; margin: 0; padding: 0; display: flex; gap: 36px; }
.nav-links a {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.82);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--gold-light); }

/* ===================== MAIN ===================== */
main {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 140px 24px 80px;
}

.coming-soon-wrap {
  max-width: 560px;
}

.coming-soon-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-light);
  margin-bottom: 24px;
}

.coming-soon-wrap h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(2.4em, 5vw, 3.6em);
  color: #ffffff;
  line-height: 1.15;
  margin-bottom: 24px;
}

.coming-soon-divider {
  width: 60px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
  margin: 0 auto 28px;
}

.coming-soon-wrap p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2em;
  font-style: italic;
  font-weight: 300;
  color: rgba(255,255,255,0.65);
  line-height: 1.7;
  margin-bottom: 40px;
}

.btn-back {
  display: inline-block;
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--indigo-deep);
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  padding: 14px 36px;
  border-radius: 3px;
  text-decoration: none;
  box-shadow: 0 8px 24px rgba(201,146,42,0.3);
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-back:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(201,146,42,0.45);
}

/* ===================== FOOTER ===================== */
footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 28px 48px;
  border-top: 1px solid rgba(255,255,255,0.07);
  font-family: 'Lato', sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.35);
}

/* ===================== HAMBURGER ===================== */
.hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 4px;
}
.hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: rgba(255,255,255,0.85);
  border-radius: 2px;
  transition: transform 0.25s, opacity 0.25s;
}
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.mobile-menu {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  background: rgba(26,32,96,0.98);
  backdrop-filter: blur(12px);
  z-index: 105;
  padding: 80px 32px 40px;
  flex-direction: column;
  gap: 8px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: 'Cinzel', serif;
  font-size: 18px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  transition: color 0.2s;
}
.mobile-menu a:last-child { border-bottom: none; }
.mobile-menu a:hover { color: var(--gold-light); }

@media (max-width: 600px) {
  nav { padding: 14px 20px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .nav-logo { width: 40px; height: 40px; }
}

</style>
</head>
<body>

<div class="topo-bg" aria-hidden="true"></div>
<div class="topo-overlay" aria-hidden="true"></div>

<nav id="main-nav" aria-label="Main navigation">
  <a href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/index.html" aria-label="Living Yoga Wisdom School — home">
    <img class="nav-logo" src="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/images/logo.png" alt="">
  </a>
  <ul class="nav-links">
    <li><a href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/courses.html">Courses</a></li>
    <li><a href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/resources.html">Resources</a></li>
    <li><a href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/contact.html">Contact</a></li>
    <li><a href="support.html" class="active">Support</a></li>
  </ul>
  <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation">
  <a href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/courses.html">Courses</a>
  <a href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/resources.html">Resources</a>
  <a href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/contact.html">Contact</a>
  <a href="support.html">Support</a>
</div>

<main>
  <div class="coming-soon-wrap">
    <p class="coming-soon-eyebrow">Support</p>
    <h1>Coming Soon</h1>
    <div class="coming-soon-divider"></div>
    <p>This page is currently being prepared. Check back soon.</p>
    <a href="https://nimai-delaware.github.io/Living-Yoga-Wisdom-School/index.html" class="btn-back">Return Home</a>
  </div>
</main>

<footer>
  <p>© 2025 Living Yoga Wisdom School</p>
</footer>

<script>
const nav = document.getElementById('main-nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 60);
});

const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobile-menu');
hamburger.addEventListener('click', () => {
  const isOpen = mobileMenu.classList.toggle('open');
  hamburger.classList.toggle('open', isOpen);
  hamburger.setAttribute('aria-expanded', isOpen);
  hamburger.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
  document.body.style.overflow = isOpen ? 'hidden' : '';
});
mobileMenu.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    mobileMenu.classList.remove('open');
    hamburger.classList.remove('open');
    hamburger.setAttribute('aria-expanded', 'false');
    hamburger.setAttribute('aria-label', 'Open menu');
    document.body.style.overflow = '';
  });
});
</script>

</body>
</html>
